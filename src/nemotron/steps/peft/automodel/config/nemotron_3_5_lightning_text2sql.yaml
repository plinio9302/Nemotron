# LoRA fine-tuning of Nemotron-3.5-Lightning-30B-A3B-BF16 (hybrid Mamba-Transformer
# MoE with a Multi-Token Prediction head) on BIRD-SQL Text2SQL, ported from
# usage-cookbook/Nemotron-3.5-Lightning/lora-text2sql/nemo-automodel/ into the
# peft/automodel step catalog.
#
# Model, MTP, backend (te/te/te/gmm/deepep), peft (exclude_modules for the mamba
# out_proj kernel), and optimizer/lr_scheduler values are carried over verbatim
# from the cookbook's nemotron_mtp_lightning35_hellaswag_peft.yaml, which is the
# hardware-validated recipe for this model (single H100 node, ep_size=8).
#
# Two deliberate deviations from that cookbook file, both from default.yaml:
#   - dataset/validation_dataset target the text2sql.py helper
#     (nemo_automodel.components.datasets.llm.text2sql.make_text2sql_dataset)
#     instead of HellaSwag, since this cookbook folder's data-prep step builds a
#     BIRD-SQL training.jsonl/validation.jsonl via that helper, not a HellaSwag
#     split. text2sql.py must be copied into the AutoModel checkout per the
#     cookbook README before this config resolves.
#   - dist_env.timeout_minutes is 30, not the cookbook's 1, since 1 minute is a
#     smoke-test value that will trip the NCCL rendezvous timeout on a real run
#     of a 30B model.
#
# Required before running (see cookbook README for prerequisites: CUDA 12.1+,
# mamba-ssm, causal-conv1d, gated HF token for the base model and BIRD dataset):
#   - dataset.path_or_dataset_id / validation_dataset.path_or_dataset_id: point
#     at the training.jsonl / validation.jsonl produced by the cookbook's BIRD-SQL
#     data-prep cell (DATASET_DIR/training.jsonl, DATASET_DIR/validation.jsonl).
#   - checkpoint.checkpoint_dir: set to your run's output directory.
#   - run.env.container_image: confirm nvcr.io/nvidia/nemo-automodel:26.04
#     carries mamba-ssm/causal-conv1d, or point at one that does.

run:
  env:
    container_image: nvcr.io/nvidia/nemo-automodel:26.04
    nodes: 1
    gpus_per_node: 8
    nprocs_per_node: 8

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 8
  local_batch_size: 1
  ckpt_every_steps: 1000
  val_every_steps: 1000
  max_steps: 100

dist_env:
  backend: nccl
  timeout_minutes: 30

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 1111
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  trust_remote_code: true
  torch_dtype: bfloat16
  # MTP is auto-enabled from the checkpoint config's num_nextn_predict_layers /
  # MTP block-pattern fields. These overrides configure 2 weight-tied MTP
  # iterations (predicting t+2 and t+3) reusing the checkpoint's single physical
  # MTP layer, mirroring Megatron's --mtp-use-repeated-layer.
  num_nextn_predict_layers: 2
  mtp_use_repeated_layer: true
  mtp_loss_scaling_factor: 0.1
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: te
    rms_norm: te
    experts: gmm
    dispatcher: deepep

checkpoint:
  enabled: true
  checkpoint_dir: ./checkpoints/nemotron-3.5-lightning-text2sql
  model_save_format: safetensors
  save_consolidated: final

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  pp_size: 1
  cp_size: 1
  ep_size: 8
  sequence_parallel: false
  # Keep false while dispatcher/checkpoint-recompute behavior is still being
  # validated for this backend combo (per peft/automodel README guardrails).
  activation_checkpointing: false

# LoRA: this is what differentiates peft/ from sft/. exclude_modules is required
# because the mamba layers' custom kernels consume out_proj.weight directly, so
# LoRA can't wrap it.
peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  exclude_modules: ["*.out_proj"]
  dim: 8
  alpha: 32
  use_triton: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

# text2sql.py must be copied into the AutoModel checkout at
# nemo_automodel/components/datasets/llm/text2sql.py for this target to resolve.
# Expects JSONL with "question"/"answer" columns (mapped to input/output).
dataset:
  _target_: nemo_automodel.components.datasets.llm.text2sql.make_text2sql_dataset
  path_or_dataset_id: /path/to/text2sql/training.jsonl

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.text2sql.make_text2sql_dataset
  path_or_dataset_id: /path/to/text2sql/validation.jsonl

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-4
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 10
  min_lr: 1.0e-5

wandb:
  project: ${oc.select:run.wandb.project,${oc.env:WANDB_PROJECT,null}}
  entity: ${oc.select:run.wandb.entity,${oc.env:WANDB_ENTITY,null}}
  name: ${oc.env:WANDB_NAME,peft-automodel-nemotron-3.5-lightning-text2sql}
